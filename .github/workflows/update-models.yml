name: Update Models List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch models from API
        id: fetch-models
        run: |
          curl -s -L -H "Authorization: Bearer ${{ secrets.RINKO_API_KEY }}" -H "New-Api-User: 522" "https://rinkoai.com/api/models" > models_raw.json

      - name: Fetch groups
        run: |
          curl -s -L -H "Authorization: Bearer ${{ secrets.RINKO_API_KEY }}" -H "New-Api-User: 522" "https://rinkoai.com/api/group/" > groups_raw.json

      - name: Parse and generate models list
        run: |
          cat << 'EOF' > scripts/generate_models.mjs
          import { readFileSync, writeFileSync } from 'fs';

          const modelsData = JSON.parse(readFileSync('models_raw.json', 'utf8'));
          const groupsData = JSON.parse(readFileSync('groups_raw.json', 'utf8'));

          const groupNames = groupsData.data;
          const groupModels = modelsData.data;

          let md = '# 支持的模型列表\n\n';
          md += `> 最后更新时间：${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}\n\n`;

          const groupModelMap = {};
          for (const [gid, models] of Object.entries(groupModels)) {
            const gName = groupNames[parseInt(gid) - 1] || `Group ${gid}`;
            if (!groupModelMap[gName]) groupModelMap[gName] = [];
            groupModelMap[gName].push(...models);
          }

          for (const [groupName, models] of Object.entries(groupModelMap)) {
            md += `## ${groupName}\n\n`;
            models.forEach(m => md += `- \`${m}\`\n`);
            md += '\n';
          }

          writeFileSync('docs/models.md', md);
          console.log('Generated docs/models.md');
          EOF

          bun run scripts/generate_models.mjs

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/models.md
          git diff --staged --exit-code || git commit -m "docs: auto-update models list $(date +'%Y-%m-%d %H:%M')"
          git push